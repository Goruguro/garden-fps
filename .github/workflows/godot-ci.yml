name: Godot 4.6 CI

on:
  push:
    branches: [ main, master, develop, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

env:
  GODOT_VERSION: "4.6.2"
  PROJECT_PATH: "godot"

jobs:
  headless-tests:
    name: Headless Verification Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Godot Engine Binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /tmp/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download & Setup Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip -O /tmp/godot.zip || \
          wget -q https://downloads.tuxfamily.org/godotengine/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
          rm /tmp/godot.zip

      - name: Link Godot to PATH
        run: |
          sudo ln -sf /tmp/godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Initialize & Import Godot Project Cache
        run: |
          echo "Importing assets in headless mode..."
          godot --headless --path ${{ env.PROJECT_PATH }} --editor --quit || true

      - name: Run Smoke Test
        run: |
          echo "Running smoke_test.gd..."
          godot --headless --path ${{ env.PROJECT_PATH }} --script res://tests/smoke_test.gd

      - name: Run Terrain & Physics Test
        run: |
          echo "Running terrain_physics_test.gd..."
          godot --headless --path ${{ env.PROJECT_PATH }} --script res://tests/terrain_physics_test.gd

      - name: Run Player Controls Test
        run: |
          echo "Running player_controls_test.gd..."
          godot --headless --path ${{ env.PROJECT_PATH }} --script res://tests/player_controls_test.gd

      - name: Run Shears Gameplay Test
        run: |
          echo "Running shears_gameplay_test.gd..."
          godot --headless --path ${{ env.PROJECT_PATH }} --script res://tests/shears_gameplay_test.gd

      - name: Run Content Collision Test
        run: |
          echo "Running content_collision_test.gd..."
          godot --headless --path ${{ env.PROJECT_PATH }} --script res://tests/content_collision_test.gd
